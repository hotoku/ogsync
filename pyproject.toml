[project]
name = "ogsync"
version = "0.1.0"
description = "Sync company Outlook (via OWA browser automation) with personal Google Calendar"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "playwright>=1.64.1",
]

[project.scripts]
ogsync = "ogsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ogsync"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
